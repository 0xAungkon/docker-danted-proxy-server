# /etc/danted.conf
# Dante SOCKS daemon configuration - listens on all addresses, port 1080, uses eth0 as external
logoutput: /var/log/danted.log

internal: 0.0.0.0 port = 1080
external: eth0

method: none
user.privileged: root
user.unprivileged: nobody

client pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

socks pass {
    from: 0.0.0.0/0 to: 0.0.0.0/0
    log: connect disconnect error
}

block {
    from: 0.0.0.0/0 to: 0.0.0.0/0
}
